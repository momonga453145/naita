<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>きせつはかせになろう</title>
<style>
:root{--blue:#2f7ce7;--blue2:#dff0ff;--green:#22a873;--ink:#25466f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f4f8fd;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
main{max-width:1500px;margin:auto;padding:14px 18px 22px}
header{display:flex;align-items:center;gap:14px;margin:0 0 14px;padding:4px 8px}
.logo{width:78px;height:78px;object-fit:contain;background:#e1f1ff;border-radius:22px;padding:3px}
h1{margin:0;color:#1766cb;font-size:clamp(1.65rem,3.5vw,3rem);font-weight:900;letter-spacing:.02em}
.layout{display:grid;grid-template-columns:210px minmax(340px,1fr) minmax(440px,1.12fr);gap:14px;align-items:stretch}
.sidebar{display:flex;flex-direction:column;gap:12px}
.navbutton{width:100%;min-height:76px;text-align:left;border:0;border-radius:18px;padding:14px 18px;font-size:1.3rem;font-weight:850;background:transparent;color:#35577e}
.navbutton.active{background:linear-gradient(135deg,#2d7bf0,#438df5);color:white}
.navicon{font-size:1.65rem;margin-right:10px}
.preview-panel{background:#fff;border-radius:24px;padding:12px;box-shadow:0 3px 12px #3975b21a;display:flex;flex-direction:column;min-width:0}
.seasons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.season{border:2px solid #c9e0fb;background:#fff;border-radius:999px;min-height:52px;font-size:1.05rem;font-weight:850;color:#365b82;padding:8px 4px}
.season.active{background:#2f80ee;color:white;border-color:#78b6ff;box-shadow:0 2px 6px #2f80ee22}
.season span{font-size:1.3rem;margin-right:4px}
.scene{position:relative;isolation:isolate;overflow:hidden;flex:1;min-height:430px;border-radius:17px;display:flex;align-items:flex-end;justify-content:center;transition:background .25s}
.scene::before,.scene::after{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none}
.scene::after{z-index:-1;inset:auto 0 0;height:30%;border-radius:50% 50% 0 0 / 18% 18% 0 0}
.scene.spring{background:linear-gradient(#a8dfff 0%,#e8f8ff 52%,#d7f0bf 53%,#a4d985 100%)}
.scene.spring::before{background:radial-gradient(circle at 12% 20%,#fff 0 4%,transparent 4.5%),radial-gradient(circle at 22% 26%,#fff 0 3%,transparent 3.5%),radial-gradient(circle at 83% 19%,#fff 0 4%,transparent 4.5%),radial-gradient(circle at 73% 25%,#fff 0 3%,transparent 3.5%),radial-gradient(ellipse at 15% 4%,#f6b5d4 0 9%,transparent 10%),radial-gradient(ellipse at 90% 8%,#f6b5d4 0 8%,transparent 9%)}
.scene.spring::after{background:linear-gradient(135deg,#bce79b,#80c66c)}
.scene.summer{background:linear-gradient(#52b7ff 0%,#b6e8ff 42%,#36bce8 43%,#168bd1 72%,#f9dda2 73%,#f3c77d 100%)}
.scene.summer::before{background:radial-gradient(circle at 82% 13%,#ffe97a 0 7%,#fff4bd 7.5% 9%,transparent 9.5%),radial-gradient(ellipse at 17% 30%,#fff 0 5%,transparent 5.5%),radial-gradient(ellipse at 23% 27%,#fff 0 7%,transparent 7.5%),radial-gradient(ellipse at 72% 34%,#fff 0 5%,transparent 5.5%),linear-gradient(180deg,transparent 0 65%,#f4d08b 66% 100%)}
.scene.summer::after{background:linear-gradient(135deg,#f8dfa3,#eec77a)}
.scene.autumn{background:linear-gradient(#b9d8f3 0%,#f8e4c6 58%,#c78a42 59%,#9b642e 100%)}
.scene.autumn::before{background:radial-gradient(ellipse at 9% 22%,#e66e25 0 11%,transparent 11.5%),radial-gradient(ellipse at 19% 30%,#f5b536 0 9%,transparent 9.5%),radial-gradient(ellipse at 91% 20%,#c94d2c 0 12%,transparent 12.5%),radial-gradient(ellipse at 82% 33%,#ef9b2d 0 9%,transparent 9.5%),radial-gradient(ellipse at 50% 18%,#f5d18c 0 3%,transparent 3.5%)}
.scene.autumn::after{background:linear-gradient(135deg,#cf944a,#a9672d)}
.scene.winter{background:linear-gradient(#8ecdf4 0%,#e7f6ff 60%,#fff 61%,#e6f3fb 100%)}
.scene.winter::before{background:radial-gradient(circle at 15% 18%,#fff 0 2%,transparent 2.5%),radial-gradient(circle at 30% 33%,#fff 0 1.5%,transparent 2%),radial-gradient(circle at 80% 15%,#fff 0 2%,transparent 2.5%),radial-gradient(circle at 68% 37%,#fff 0 1.5%,transparent 2%),radial-gradient(circle at 50% 10%,#fff 0 2%,transparent 2.5%)}
.scene.winter::after{background:linear-gradient(135deg,#fff,#dbeef9)}
.character-layer{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:1} #avatar{position:absolute;inset:0;width:100%;height:100%;max-height:none;max-width:none;object-fit:contain;object-position:center center;z-index:1;filter:drop-shadow(0 5px 4px #23425c20)} #clothingOverlay{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible;filter:drop-shadow(0 5px 4px #23425c20)}
.preview-bottom{display:flex;justify-content:center;padding:10px 0 2px}
.reset{min-width:180px;min-height:52px;border:2px solid #9dc8ff;background:#fff;border-radius:999px;color:#2878df;font-weight:850;font-size:1.05rem}
.clothes{display:flex;flex-direction:column;gap:14px;min-width:0}
.clothes-panel{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 3px 12px #3975b21a;border:1px solid #d9efff}
.panel-head{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#e3f3ff;color:#1267c9;font-size:1.35rem;font-weight:900}
.bottom .panel-head{background:#e2f8ed;color:#15945f}
.headicon{display:inline-flex;width:50px;height:50px;align-items:center;justify-content:center;border-radius:14px;background:#237ce9;color:white;font-size:1.7rem}
.bottom .headicon{background:#19a76b}
.filters{display:flex;gap:7px;padding:10px 12px 0;overflow-x:auto}
.filter{white-space:nowrap;border:0;border-radius:999px;padding:10px 14px;background:#f1f5fb;color:#42617f;font-weight:800;font-size:.9rem;min-height:40px}
.filter.active{background:#2f80ee;color:white}
.bottom .filter.active{background:#36b67d}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 12px 14px}
.clothing{min-width:0;padding:5px 4px 7px;border:2px solid #e0eaf5;border-radius:14px;background:#fff;color:#345778;font-size:.82rem;font-weight:800;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:130px}
.clothing.active{border:3px solid #2588f4;background:#f5faff;color:#0872df}
.bottom .clothing.active{border-color:#2588f4}
.garment{height:82px;width:100%;display:flex;align-items:center;justify-content:center;font-size:3.7rem;background:linear-gradient(145deg,#fbfdff,#f2f7fc);border-radius:9px}
.garment img{width:100%;height:100%;object-fit:contain}
.clothing-label{overflow-wrap:anywhere}
.note{font-size:.8rem;color:#6c7e93;text-align:center;margin:0;padding:0 10px 12px}
@media(max-width:1000px){main{padding:10px}.layout{grid-template-columns:150px minmax(260px,1fr)}.clothes{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.scene{min-height:370px}}
@media(max-width:650px){.layout{grid-template-columns:1fr}header{gap:10px}.logo{width:58px;height:58px}.sidebar{display:grid;grid-template-columns:1fr 1fr}.navbutton{min-height:58px;font-size:1.1rem}.preview-panel{min-height:480px}.scene{min-height:390px}.clothes{grid-column:auto;display:flex}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.clothing{min-height:120px}.garment{height:75px}}

/* Improved outfit overlay alignment and garment finish */
.character-layer{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;isolation:isolate}
#avatar{position:absolute;inset:0;width:100%;height:100%;max-height:none;max-width:none;object-fit:contain;object-position:center center;z-index:1;filter:drop-shadow(0 5px 4px #23425c20)}
#clothingOverlay{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible;filter:drop-shadow(0 5px 4px #23425c20)}

</style>
</head>

<script>
const scene = document.getElementById("scene");
function setSeason(season){
  scene.className = "scene " + season;
  document.querySelectorAll("[data-season]").forEach(b => {
    const active = b.dataset.season === season;
    b.classList.toggle("active", active);
    b.setAttribute("aria-pressed", String(active));
  });
}
document.querySelectorAll("[data-season]").forEach(button => button.addEventListener("click", () => setSeason(button.dataset.season)));

let selectedTop = "tank";
let selectedBottom = "short";
const SKIN = "#f3c096", SKIN_D = "#d9a077";
// Left-arm geometry (T-pose, 1254x1254 space). Right side is mirrored around x=620.
const armTop = x => 402 + (500 - x) * 0.128;
const armBot = x => 468 + (500 - x) * 0.05;
function sleeve(endX, fill, stroke, pad = 8, extra = "") {
  const pts = `512,384 ${endX},${armTop(endX) - pad} ${endX},${armBot(endX) + pad} 498,${armBot(498) + pad + 30}`;
  const one = `<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="5" stroke-linejoin="round"/>${extra}`;
  return `<g>${one}</g><g transform="translate(1240 0) scale(-1 1)">${one}</g>`;
}
const torso = (fill, stroke, hem = 706, neck = "crew") =>
  `<path d="M525 386 Q620 ${neck === "v" ? 470 : 420} 715 386 L745 408 L745 ${hem - 20} Q620 ${hem + 22} 495 ${hem - 20} L495 408 Z" fill="${fill}" stroke="${stroke}" stroke-width="5" stroke-linejoin="round"/>`;
const collarRing = c => `<path d="M560 388 Q620 436 680 388" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"/>`;
const skinNeckFill = `<path d="M565 386 Q620 430 675 386 Q620 408 565 386Z" fill="${SKIN_D}"/>`;

const tops = {
  tank: () => `<g stroke-linejoin="round"><path d="M548 384 L582 390 Q620 452 658 390 L692 384 L702 452 Q738 482 740 525 L740 706 Q620 728 500 706 L500 525 Q502 482 538 452 Z" fill="#4fc3f0" stroke="#2a8fc0" stroke-width="5"/><path d="M505 590 L740 540 L740 585 L505 635 Z" fill="#ffc93c" opacity=".95"/><path d="M582 390 Q620 452 658 390" fill="none" stroke="#2a8fc0" stroke-width="6"/></g>`,
  tshirt: () => `${sleeve(400, "#fdfdfd", "#c4cedb")}${torso("#fdfdfd", "#c4cedb")}${collarRing("#b7c3d3")}<path d="M520 660 L720 660" stroke="#e5ebf3" stroke-width="4"/>`,
  longshirt: () => `${sleeve(205, "#f4a62a", "#c47e10")}${torso("#f4a62a", "#c47e10")}${collarRing("#c47e10")}<path d="M205 ${armTop(205)+14} L205 ${armBot(205)-2}" stroke="#c47e10" stroke-width="6"/><path d="M1035 ${armTop(205)+14} L1035 ${armBot(205)-2}" stroke="#c47e10" stroke-width="6"/>`,
  lab: () => `<g stroke-linejoin="round"><path d="M575 380 Q620 455 665 380 L690 560 L550 560 Z" fill="#2c2f38"/>${sleeve(192, "#ffffff", "#c2ccd9", 14)}<path d="M515 384 L552 396 L620 462 L688 396 L725 384 L752 408 L752 930 Q620 952 488 930 L488 408 Z" fill="#ffffff" stroke="#c2ccd9" stroke-width="5"/><path d="M552 396 L596 470 L620 462 L644 470 L688 396 L722 400 L690 480 L650 934 L590 934 L550 480 L518 400 Z" fill="#f1f4f9" stroke="#d2dae6" stroke-width="4"/><path d="M620 462 L620 934" stroke="#c2ccd9" stroke-width="4"/><rect x="505" y="740" width="70" height="120" rx="8" fill="#f1f4f9" stroke="#d2dae6" stroke-width="4"/><rect x="665" y="740" width="70" height="120" rx="8" fill="#f1f4f9" stroke="#d2dae6" stroke-width="4"/><rect x="668" y="520" width="62" height="64" rx="6" fill="#f1f4f9" stroke="#d2dae6" stroke-width="4"/></g>`,
  parka: () => `<g stroke-linejoin="round"><path d="M520 388 Q620 330 720 388 L735 430 Q620 470 505 430 Z" fill="#8e97a6" stroke="#6b7586" stroke-width="5"/>${sleeve(205, "#aab2bf", "#6b7586", 12)}${torso("#aab2bf", "#6b7586", 730)}<path d="M556 396 Q620 468 684 396" fill="none" stroke="#6b7586" stroke-width="6"/><path d="M596 436 L592 520 M644 436 L648 520" stroke="#6b7586" stroke-width="5" stroke-linecap="round"/><path d="M545 640 L695 640 L715 722 L525 722 Z" fill="#9aa3b1" stroke="#6b7586" stroke-width="5"/><path d="M205 ${armBot(205)-6} L205 ${armTop(205)+6}" stroke="#6b7586" stroke-width="10"/></g>`,
  jacket: () => `<g stroke-linejoin="round">${sleeve(205, "#1f4f94", "#112f5e", 10, `<path d="M500 ${armTop(500)+6} L205 ${armTop(205)+6}" stroke="#fff" stroke-width="7"/>`)}${torso("#1f4f94", "#112f5e", 706)}<path d="M556 388 L620 458 L684 388 L660 380 Q620 410 580 380 Z" fill="#173d75" stroke="#112f5e" stroke-width="5"/><path d="M620 458 L620 712" stroke="#d6dfec" stroke-width="6"/><path d="M505 706 Q620 728 735 706" fill="none" stroke="#112f5e" stroke-width="8"/></g>`,
  down: () => `<g stroke-linejoin="round">${sleeve(205, "#2a3240", "#141a24", 20)}${torso("#2a3240", "#141a24", 740)}<path d="M498 500 Q620 530 742 500 M498 575 Q620 605 742 575 M498 650 Q620 680 742 650" fill="none" stroke="#141a24" stroke-width="5"/><path d="M530 390 Q620 340 710 390 L715 420 Q620 460 525 420 Z" fill="#3a4454" stroke="#141a24" stroke-width="5"/><path d="M620 440 L620 740" stroke="#7d8aa0" stroke-width="5"/></g>`,
  vest: () => `<g stroke-linejoin="round"><path d="M531 384 L580 396 L620 456 L660 396 L709 384 L742 430 L742 706 Q620 730 498 706 L498 430 Z" fill="#ff8a1f" stroke="#c4600a" stroke-width="5"/><path d="M505 560 L735 560 M505 610 L735 610" stroke="#f5f5d8" stroke-width="14"/><path d="M620 456 L620 712" stroke="#c4600a" stroke-width="5"/><path d="M560 640 L596 640 L596 690 L560 690 Z M644 640 L680 640 L680 690 L644 690 Z" fill="#f07712" stroke="#c4600a" stroke-width="4"/></g>`
};

const waist = (c) => `<path d="M495 702 Q620 728 745 702" fill="none" stroke="${c}" stroke-width="10"/>`;
const longLegs = (fill, stroke, hem = 1118) =>
  `<path d="M495 702 Q620 728 745 702 L738 ${hem} L648 ${hem} L628 842 L612 842 L592 ${hem} L502 ${hem} Z" fill="${fill}" stroke="${stroke}" stroke-width="5" stroke-linejoin="round"/><path d="M620 724 L620 840" stroke="${stroke}" stroke-width="4"/>`;
const shortLegs = (fill, stroke, hem) =>
  `<path d="M495 702 Q620 728 745 702 L748 ${hem} L642 ${hem} L626 ${hem - 52} L614 ${hem - 52} L598 ${hem} L492 ${hem} Z" fill="${fill}" stroke="${stroke}" stroke-width="5" stroke-linejoin="round"/><path d="M620 724 L620 ${hem - 52}" stroke="${stroke}" stroke-width="4"/>`;
const bottoms = {
  long: () => longLegs("#2f5fb3", "#1b3b7a") + waist("#1b3b7a") + `<path d="M520 760 L570 790 M720 760 L670 790" stroke="#1b3b7a" stroke-width="4" fill="none"/>`,
  short: () => shortLegs("#27b5e8", "#1789b5", 900) + waist("#0f6f96") + `<path d="M520 940 L520 940" /><path d="M600 722 L590 790 M640 722 L650 790" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M500 880 Q545 905 590 880 M650 880 Q695 905 740 880" stroke="#8fe08a" stroke-width="6" fill="none"/>`,
  sweat: () => longLegs("#aeb5c0", "#7f8896") + waist("#e1e5ea") + `<path d="M505 1085 L595 1085 M645 1085 L735 1085" stroke="#7f8896" stroke-width="12"/><path d="M608 724 L604 780 M632 724 L636 780" stroke="#fff" stroke-width="5" stroke-linecap="round"/>`,
  chino: () => shortLegs("#d6b274", "#a98a4f", 960) + waist("#a98a4f") + `<path d="M530 760 L575 760 M665 760 L710 760" stroke="#a98a4f" stroke-width="4"/>`,
  uniform: () => longLegs("#1c2f4d", "#0d1c33") + waist("#0d1c33") + `<path d="M545 760 L545 1110 M695 760 L695 1110" stroke="#2c4568" stroke-width="3"/>`,
  denim: () => shortLegs("#4a84b8", "#27608d", 930) + waist("#27608d") + `<path d="M520 744 Q570 780 590 744 M720 744 Q670 780 650 744" stroke="#b9d3e6" stroke-width="4" fill="none"/><path d="M497 930 L593 930 M647 930 L743 930" stroke="#b9d3e6" stroke-width="5" stroke-dasharray="8 6"/>`,
  skirt: () => `<path d="M495 702 Q620 728 745 702 L800 920 Q620 950 440 920 Z" fill="#c0397a" stroke="#8a2257" stroke-width="5" stroke-linejoin="round"/><path d="M545 720 L500 928 M585 726 L565 938 M620 728 L620 942 M655 726 L675 938 M695 720 L740 928" stroke="#e286b3" stroke-width="5" fill="none"/>${waist("#8a2257")}`,
  cargo: () => longLegs("#5f6d48", "#3b4629") + waist("#3b4629") + `<rect x="506" y="830" width="64" height="74" rx="4" fill="#6e7d53" stroke="#3b4629" stroke-width="4"/><rect x="670" y="830" width="64" height="74" rx="4" fill="#6e7d53" stroke="#3b4629" stroke-width="4"/>`
};

function armSkin() {
  const one = `<path d="M505 392 L188 ${armTop(188) + 2} L188 ${armBot(188) - 4} L500 ${armBot(500) + 36} Z" fill="${SKIN}" stroke="${SKIN_D}" stroke-width="3" stroke-linejoin="round"/>`;
  return one + `<g transform="translate(1240 0) scale(-1 1)">${one}</g>`;
}
const fold=(d,o=.16,w=7)=>`<path d="${d}" fill="none" stroke="#10151f" stroke-opacity="${o}" stroke-width="${w}" stroke-linecap="round" filter="url(#blur3)"/>`;
const hi=(d,o=.22,w=8)=>`<path d="${d}" fill="none" stroke="#fff" stroke-opacity="${o}" stroke-width="${w}" stroke-linecap="round" filter="url(#blur4)"/>`;
const mir=s=>s+`<g transform="translate(1240 0) scale(-1 1)">${s}</g>`;
function topFolds(id){
  if(id==="tank"||id==="vest") return fold("M512 640 Q560 660 600 650 M640 650 Q690 662 730 640",.14)+fold("M560 470 Q552 520 560 580",.1,10)+fold("M680 470 Q688 520 680 580",.1,10);
  const long=!["tshirt"].includes(id);
  let s=mir(fold("M498 505 Q520 470 560 452",.2,9)+fold(`M520 ${armBot(520)+12} Q480 ${armBot(500)+24} 440 ${armBot(440)+10}`,.14,6));
  if(long) s+=mir(fold(`M345 ${armTop(345)+22} Q352 ${armBot(345)-8} 340 ${armBot(345)+6} M330 ${armTop(330)+26} Q338 ${armBot(330)-4} 326 ${armBot(330)+8}`,.17,5)+fold("M260 "+(armTop(260)+22)+" Q268 "+(armBot(260)-2)+" 258 "+(armBot(260)+8),.13,5)+hi(`M440 ${armTop(440)+3} L240 ${armTop(240)+3}`,.18,7));
  s+=fold("M505 690 Q560 712 620 712 Q680 712 735 690",.18,10)+fold("M540 600 Q580 620 615 608",.1,8)+fold("M700 560 Q672 590 690 640",.1,8)+hi("M530 470 Q525 560 535 640",.14,16)+hi("M700 470 Q712 520 708 560",.1,12);
  return s;
}
function bottomFolds(id){
  const sk=id==="skirt";
  if(sk) return fold("M545 725 L503 920 M620 735 L620 940 M695 725 L737 920",.14,10)+fold("M500 725 Q620 750 740 725",.2,10);
  const shortHem={short:900,chino:960,denim:930}[id];
  let s=fold("M500 712 Q560 740 612 726 M740 712 Q680 740 628 726",.2,9)+fold("M617 740 L617 840",.22,6);
  s+=hi("M520 740 Q512 820 520 900",.14,16)+hi("M720 740 Q728 820 720 900",.14,16);
  if(!shortHem){
    s+=fold("M520 960 Q555 975 590 962 M520 985 Q552 996 588 986 M650 962 Q685 975 720 960 M652 986 Q688 996 722 985",.2,5);
    s+=fold("M510 1060 Q550 1075 592 1062 M648 1062 Q690 1075 730 1060",.16,6)+fold("M505 1110 Q550 1122 596 1112 M644 1112 Q690 1122 735 1110",.28,9);
    s+=hi("M545 900 L552 1100",.1,10)+hi("M695 900 L688 1100",.1,10);
  } else s+=fold(`M498 ${shortHem-4} Q545 ${shortHem+10} 592 ${shortHem-4} M648 ${shortHem-4} Q695 ${shortHem+10} 742 ${shortHem-4}`,.25,9);
  return s;
}
const skinShade=()=>
  `<ellipse cx="620" cy="396" rx="48" ry="16" fill="#8a5a3a" opacity=".35" filter="url(#blur6)"/>`+
  `<path d="M575 405 Q595 418 614 410 M665 405 Q645 418 626 410" fill="none" stroke="#a8714b" stroke-opacity=".5" stroke-width="4" stroke-linecap="round" filter="url(#blur3)"/>`+
  `<path d="M560 500 Q590 540 615 520 M680 500 Q650 540 625 520" fill="none" stroke="#b07a55" stroke-opacity=".35" stroke-width="10" stroke-linecap="round" filter="url(#blur4)"/>`+
  `<path d="M620 520 L620 690" stroke="#b07a55" stroke-opacity=".3" stroke-width="5" filter="url(#blur3)"/>`+
  mir(`<path d="M340 ${armTop(340)+12} L190 ${armTop(190)+12}" stroke="#fff" stroke-opacity=".3" stroke-width="8" filter="url(#blur4)" fill="none"/><path d="M420 ${armBot(420)+2} L200 ${armBot(200)-4}" stroke="#a8714b" stroke-opacity=".4" stroke-width="8" filter="url(#blur4)" fill="none"/>`)+
  `<path d="M545 800 Q550 900 553 1010 M695 800 Q690 900 687 1010" stroke="#fff" stroke-opacity=".18" stroke-width="14" fill="none" filter="url(#blur4)"/><path d="M600 860 Q598 1000 596 1130 M640 860 Q642 1000 644 1130" stroke="#a8714b" stroke-opacity=".3" stroke-width="12" fill="none" filter="url(#blur4)"/>`+
  `<ellipse cx="548" cy="1010" rx="22" ry="14" fill="#fff" opacity=".12" filter="url(#blur4)"/><ellipse cx="692" cy="1010" rx="22" ry="14" fill="#fff" opacity=".12" filter="url(#blur4)"/>`;
function refreshAvatar() {
  document.getElementById("layerBody").innerHTML =
    `<path d="M570 330 L670 330 L676 410 L564 410 Z" fill="url(#skinH)"/>` + armSkin() +
    `<path d="M520 392 Q620 430 720 392 L742 420 L742 708 L498 708 L498 420 Z" fill="url(#skinH)"/>` +
    `<path d="M502 700 Q620 726 738 700 L734 1146 L650 1146 L630 840 L610 840 L590 1146 L506 1146 Z" fill="url(#skinH)" stroke="${SKIN_D}" stroke-width="3" stroke-linejoin="round"/>` + skinShade();
  document.getElementById("layerBottom").innerHTML = bottoms[selectedBottom]() + bottomFolds(selectedBottom);
  document.getElementById("layerTop").innerHTML = tops[selectedTop]() + topFolds(selectedTop);
}
function pick(kind, id) {
  if (kind === "top") selectedTop = id; else selectedBottom = id;
  document.querySelectorAll(`[data-kind="${kind}"]`).forEach(b => b.classList.toggle("active", b.dataset.id === id));
  refreshAvatar();
}
document.querySelectorAll("[data-kind]").forEach(button => button.addEventListener("click", () => pick(button.dataset.kind, button.dataset.id)));
document.querySelectorAll("[data-filter]").forEach(button => button.addEventListener("click", () => {
  const kind = button.dataset.filter, val = button.dataset.value;
  document.querySelectorAll(`[data-filter="${kind}"]`).forEach(b => b.classList.toggle("active", b === button));
  document.querySelectorAll(`[data-kind="${kind}"]`).forEach(item => {
    item.style.display = val === "all" || item.dataset.category === val ? "" : "none";
  });
}));
function setNav(id) {
  document.getElementById("navTop").classList.toggle("active", id === "top");
  document.getElementById("navBottom").classList.toggle("active", id === "bottom");
  document.getElementById(id === "top" ? "topGrid" : "bottomGrid").scrollIntoView({behavior: "smooth", block: "nearest"});
}
document.getElementById("navTop").addEventListener("click", () => setNav("top"));
document.getElementById("navBottom").addEventListener("click", () => setNav("bottom"));
document.getElementById("reset").addEventListener("click", () => {
  setSeason("summer");
  document.querySelectorAll("[data-filter]").forEach(b => b.classList.toggle("active", b.dataset.value === "all"));
  document.querySelectorAll('[data-kind]').forEach(item => item.style.display = "");
  pick("top", "tank"); pick("bottom", "short");
});
function buildThumbs(){
  document.querySelectorAll(".clothing").forEach(btn=>{
    const kind=btn.dataset.kind,id=btn.dataset.id,box=btn.querySelector(".garment");
    const inner=kind==="top"?tops[id]()+topFolds(id):bottoms[id]()+bottomFolds(id);
    box.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible"><g class="tg" filter="url(#cloth)">${inner}</g></svg>`;
    const svg=box.firstChild,g=svg.querySelector(".tg"),bb=g.getBBox();
    if(kind==="top"){
      const hem=id==="lab"?960:id==="down"?770:id==="parka"?750:730, side=hem-340+20;
      svg.style.overflow="hidden";
      svg.setAttribute("viewBox",`${620-side/2} 335 ${side} ${side}`);
    } else {
      const p=14,w=bb.width+p*2,h=bb.height+p*2,side=Math.max(w,h);
      svg.setAttribute("viewBox",`${bb.x-p-(side-w)/2} ${bb.y-p-(side-h)/2} ${side} ${side}`);
    }
  });
}
buildThumbs();
refreshAvatar();
</script>
</body>
</html>
